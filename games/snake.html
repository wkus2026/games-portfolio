<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            font-family: Arial, sans-serif;
        }

        .game-wrapper {
            text-align: center;
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 400px;
            background: #1a1a1a;
            border: 3px solid #f5576c;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .info-panel {
            background: rgba(0,0,0,0.8);
            color: #f5576c;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .info-panel span {
            font-weight: bold;
            color: #f093fb;
        }

        .controls {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 100;
            min-width: 250px;
            border: 3px solid #f5576c;
        }

        .game-over h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #f5576c;
        }

        .game-over p {
            font-size: 18px;
            margin: 10px 0;
        }

        .game-over button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background: #f5576c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .game-over button:hover {
            background: #f093fb;
        }

        .arrow-buttons {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 5px;
            margin-top: 20px;
            justify-content: center;
        }

        .arrow-btn {
            padding: 10px;
            background: #f5576c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .arrow-btn:active {
            transform: scale(0.95);
            background: #f093fb;
        }

        .arrow-btn:hover {
            background: #f093fb;
        }

        .empty {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1 style="color: white; margin-bottom: 20px;">🐍 Snake Game</h1>
        <div class="info-panel">
            Score: <span id="score">0</span> | Best: <span id="bestScore">0</span>
        </div>
        <div class="controls">
            Gebruik pijltoetsen of knoppen om te bewegen
        </div>
        <div class="game-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-over" id="gameOver">
                <h2>Game Over!</h2>
                <p>Score: <span id="finalScore">0</span></p>
                <button onclick="location.reload()">Opnieuw Spelen</button>
            </div>
        </div>
        <div class="arrow-buttons">
            <button class="arrow-btn empty"></button>
            <button class="arrow-btn" onclick="changeDirection('UP')">⬆</button>
            <button class="arrow-btn empty"></button>
            <button class="arrow-btn" onclick="changeDirection('LEFT')">⬅</button>
            <button class="arrow-btn empty"></button>
            <button class="arrow-btn" onclick="changeDirection('RIGHT')">➡</button>
            <button class="arrow-btn empty"></button>
            <button class="arrow-btn" onclick="changeDirection('DOWN')">⬇</button>
            <button class="arrow-btn empty"></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 }
        ];

        let food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };

        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let bestScore = localStorage.getItem('snakeBestScore') || 0;
        let gameRunning = true;

        document.getElementById('bestScore').textContent = bestScore;

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
            }
        });

        function changeDirection(dir) {
            switch(dir) {
                case 'UP':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    break;
                case 'DOWN':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    break;
                case 'LEFT':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    break;
                case 'RIGHT':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

        function drawGame() {
            // Background
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#f093fb';
                } else {
                    ctx.fillStyle = '#f5576c';
                }
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });

            // Draw food
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function update() {
            if (!gameRunning) return;

            direction = nextDirection;

            // Move snake
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Check boundaries
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                
                // Generate new food
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } else {
                snake.pop();
            }
        }

        function endGame() {
            gameRunning = false;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snakeBestScore', bestScore);
            }
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function gameLoop() {
            drawGame();
            update();
            setTimeout(gameLoop, 100);
        }

        gameLoop();
    </script>
</body>
</html>
